<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seeing.eye</title>
  <!-- Иконка вкладки -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 1. HERO -->
  <section class="hero">
    <h1 id="typewriter" class="neon-text"></h1>
  </section>

  <!-- 2. ТЕРМИНАЛ -->
  <section class="terminal-section">
    <div class="terminal-box">
      <p id="terminal-text"></p>
    </div>
  </section>

  <!-- 3. DISCORD -->
  <section class="discord-section">
    <div class="discord-card">
      <img src="assets/discord.jpg" alt="Discord" class="discord-img">
      <div class="discord-info">
        <p>discord server:</p>
        <a href="https://discord.gg/CmP3K7eZ4" target="_blank">https://discord.gg/CmP3K7eZ4</a>
      </div>
    </div>
  </section>

  <!-- 4. GITHUB -->
  <section class="github-section">
    <div class="github-card">
      <img src="assets/github.jpg" alt="GitHub" class="github-img">
      <div class="github-info">
        <p>github:</p>
        <a href="https://github.com/Hu2ie" target="_blank">https://github.com/Hu2ie</a>
      </div>
    </div>
  </section>

  <!-- 5. КНОПКА ПЕРЕХОДА В MORE -->
  <section class="more-section">
    <a href="more/index.html" class="more-btn">[ MORE ]</a>
  </section>

  <!-- 6. ВИДЕО -->
  <section class="video-section">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="assets/video1.mp4" type="video/mp4">
    </video>
    <div class="video-overlay">
      <p>We invite you to join us.</p>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
